[project]
name = "kestrel-feature-mcp"
version = "0.13.0"
description = "Model Context Protocol (MCP) server management for Kestrel Sovereign agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    # Public native cancellation checkpoint for original cleanup owners.
    "anyio>=4.7,<5",
    "kestrel-sovereign-sdk[crypto,httpx2]>=0.48.0,<1",
    "Authlib>=1.9.4,<2",
    "docker>=7.1.0",
    "requests>=2.34.2",
    "mcp>=2.3,<3",
    "jsonschema>=4.26,<5",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
    "kestrel-sovereign>=0.62.2,<1",
    "packaging",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3.1",
    "cryptography>=46",
]

[project.entry-points."kestrel_sovereign.features"]
MCPAgent = "kestrel_feature_mcp.feature:MCPAgent"

[project.scripts]
kestrel-mcp-apps-sandbox = "kestrel_mcp_apps_sandbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"kestrel_mcp_apps_sandbox.py" = "kestrel_mcp_apps_sandbox.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "apps_browser: native Core chat, MCP Apps and OAuth browser integration",
    "docker: tests that require Docker",
    "docker_mcp: tests that require Docker MCP Toolkit",
]
