[project]
name = "kestrel-feature-mcp"
version = "0.7.2"
description = "Model Context Protocol (MCP) server management for Kestrel Sovereign agents"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.15"
dependencies = [
    "kestrel-sovereign-sdk[httpx2]>=0.42.4,<1",
    "docker>=7.1.0",
    "requests>=2.34.2",
    "mcp>=2.3,<3",
    "jsonschema>=4.26,<5",
    "anyio>=4.7,<5",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
    "packaging",
    "pytest>=8.0.0",
    "pytest-asyncio>=1.1.0",
    "pytest-timeout>=2.3.1",
    "cryptography>=46",
]

[project.entry-points."kestrel_sovereign.features"]
MCPAgent = "kestrel_feature_mcp.feature:MCPAgent"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["kestrel_feature_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "docker: tests that require Docker",
    "docker_mcp: tests that require Docker MCP Toolkit",
]
