name: mcp
description: Model Context Protocol (MCP) server management - gateway mode for 311+ servers, direct container management
version: 1.0.0
entry_point: feature.py

tools:
  - mcp_catalog
  - mcp_docker_catalog
  - mcp_gateway_enable
  - mcp_gateway_start
  - mcp_gateway_stop
  - mcp_gateway_tools
  - mcp_list_servers
  - mcp_load_server
  - mcp_search
  - mcp_server_info
  - mcp_unload_server

files:
  - __init__.py
  - catalog.toml
  - connection.py
  - constants.py
  - dynamic_tools.py
  - feature.py
  - gateway.py
  - images.py
  - manager.py
  - registry.py

dependencies:
  - docker
