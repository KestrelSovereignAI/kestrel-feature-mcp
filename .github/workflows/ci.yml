name: kestrel-feature-mcp CI

on:
  push:
    branches:
      - main
      - 'feat/*'
      - 'fix/*'
      - 'release/*'
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 'Tag or commit to test (passed through from publish.yml so the CI gate runs on the same SHA the build job will check out)'
        required: false
        type: string

env:
  PYTHON_VERSION: "3.13"

jobs:
  lint-and-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install package + test extras
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          . .venv/bin/activate
          uv pip install -e '.[test]'
      - name: Validate package imports
        run: |
          . .venv/bin/activate
          python -c "
          from kestrel_feature_mcp import (
              MCPAgent,
              MCPRegistry,
              MCPServerEntry,
              ServerType,
              TransportType,
              ServerCategory,
              get_registry,
              check_docker_mcp_available,
          )
          registry = get_registry()
          assert registry.list_all(), 'MCP registry should load bundled catalog entries'
          assert check_docker_mcp_available() in (True, False)
          print('kestrel_feature_mcp imports OK; feature class:', MCPAgent.__name__)
          "
        timeout-minutes: 3

  build-check:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Build sdist + wheel
        run: uv build
      - name: Inspect wheel contents
        run: |
          set -e
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Inspecting $WHEEL"
          uv run --no-project python -c "
          import zipfile, sys
          z = zipfile.ZipFile('$WHEEL')
          names = z.namelist()
          forbidden = [n for n in names if n.startswith('kestrel_sovereign/') or n.startswith('kestrel_sdk/')]
          if forbidden:
              print('ERROR: wheel contains framework/SDK content:', forbidden, file=sys.stderr)
              sys.exit(1)
          required = [
              'kestrel_feature_mcp/__init__.py',
              'kestrel_feature_mcp/feature.py',
              'kestrel_feature_mcp/gateway.py',
              'kestrel_feature_mcp/manager.py',
              'kestrel_feature_mcp/images.py',
              'kestrel_feature_mcp/connection.py',
              'kestrel_feature_mcp/remote.py',
              'kestrel_feature_mcp/constants.py',
              'kestrel_feature_mcp/dynamic_tools.py',
              'kestrel_feature_mcp/registry.py',
              'kestrel_feature_mcp/official_registry.py',
              'kestrel_feature_mcp/registry_openapi_2025_12_01.json',
              'kestrel_feature_mcp/registry_contract_LICENSE.txt',
              'kestrel_feature_mcp/catalog.toml',
              'kestrel_feature_mcp/component.yaml',
              'kestrel_mcp_apps_sandbox.py',
              'kestrel_feature_mcp/apps_sandbox/sandbox-entry.js',
              'kestrel_feature_mcp/apps_sandbox/sandbox-service.mjs',
              'kestrel_feature_mcp/apps_sandbox/THIRD_PARTY_NOTICES.txt',
              'kestrel_feature_mcp/apps_sandbox/manifest.json',
          ]
          missing = [m for m in required if m not in names]
          if missing:
              print('ERROR: wheel missing expected files:', missing, file=sys.stderr)
              sys.exit(1)
          print(f'Wheel OK ({len(names)} entries)')
          "

  apps-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Set up maintained Node LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked browser dependencies
        run: npm ci --prefix web --no-audit --no-fund
        timeout-minutes: 5
      - name: Verify packaged assets against a clean build
        run: npm run build --prefix web -- --check
      - name: Verify standalone service and build failures
        run: npm run test:node --prefix web
      - name: Install Chromium and browser system dependencies
        run: npm exec --prefix web -- playwright install --with-deps chromium
        timeout-minutes: 20
      - name: Verify actual browser isolation and native Apps protocol
        run: npm test --prefix web
        timeout-minutes: 5
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: Build and normally install the feature wheel
        run: |
          uv build --wheel
          uv venv --python 3.14 "$RUNNER_TEMP/mcp-apps-install"
          uv pip install --python "$RUNNER_TEMP/mcp-apps-install/bin/python" dist/*.whl
      - name: Verify the installed public sandbox and credential boundary
        run: |
          "$RUNNER_TEMP/mcp-apps-install/bin/python" -I tests/packaging/sandbox_installed.py --node "$(command -v node)"

  install-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-check
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Clean install + smoke test
        run: |
          uv venv --python ${{ matrix.python-version }} .venv-test
          . .venv-test/bin/activate
          uv pip install '.[test]'
          python -c "
          from kestrel_feature_mcp import MCPAgent, get_registry
          import importlib.metadata as md
          eps = md.entry_points(group='kestrel_sovereign.features')
          names = [e.name for e in eps]
          assert 'MCPAgent' in names, f'Entry-point not registered: {names}'
          assert get_registry().list_all(), 'Registry catalog did not load'
          print(f'kestrel-feature-mcp installs + entry-point OK on Python ${{ matrix.python-version }}')
          "
          python -m pytest tests/unit -q
      - name: Set up conformance Node runtime
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
        timeout-minutes: 3
      - name: Install pinned official conformance harness
        run: npm ci --prefix tests/conformance --ignore-scripts --no-audit --no-fund
        timeout-minutes: 3
      - name: Verify the frozen native MCP client profile
        run: |
          set -e
          version=$(.venv-test/bin/python -c 'from tests.conformance.client import load_profile; print(load_profile()["protocol_version"])')
          scenarios=$(.venv-test/bin/python -c 'from tests.conformance.client import load_profile; print(" ".join(load_profile()["scenarios"]))')
          for scenario in $scenarios; do
            tests/conformance/node_modules/.bin/conformance client \
              --command '.venv-test/bin/python tests/conformance/client.py' \
              --scenario "$scenario" --spec-version "$version" --timeout 60000 \
              --output-dir "tests/conformance/results/$scenario"
          done
        timeout-minutes: 10
      - name: Preserve official conformance reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-conformance-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: tests/conformance/results/
          if-no-files-found: warn
        timeout-minutes: 3

  test:
    runs-on: ubuntu-latest
    needs: lint-and-imports
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Install + run pytest
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv
          . .venv/bin/activate
          uv pip install -e '.[test]'
          uv run --no-sync pytest tests/ -v --tb=short -m "not docker and not docker_mcp"
        timeout-minutes: 10
